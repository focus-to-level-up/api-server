spring:
  datasource-data:
    jdbc-url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  datasource-meta:
    jdbc-url: ${DB_META_URL}
    username: ${DB_META_USERNAME}
    password: ${DB_META_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          auto: validate

  batch:
    jdbc:
      initialize-schema: never

logging:
  level:
    org.hibernate.SQL: WARN
