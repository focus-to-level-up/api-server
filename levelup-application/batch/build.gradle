bootJar { enabled = true }
jar { enabled = false }

dependencies {
    implementation project(':levelup-domain')
    implementation project(':levelup-common')
    implementation project(':levelup-infra:mysql')
    implementation project(':levelup-infra:redis')

    // Batch Core
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.google.guava:guava:33.2.1-jre'

    // Distributed Lock (배치 중복 실행 방지)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.10.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.10.0'

    // Monitoring
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.3.0'

    // testImplementation 'org.springframework.batch:spring-batch-test'
}
