<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Admin 계정 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('admins')}"></aside>
    <main class="content">
        <header class="page-header">
            <div>
                <h1>관리자 계정</h1>
                <p>로그인 가능한 독립 Admin 계정을 등록합니다.</p>
            </div>
        </header>

        <div class="alert success" th:if="${message}" th:text="${message}"></div>

        <section class="two-column">
            <article class="panel">
                <h2>등록된 관리자</h2>
                <table>
                    <thead>
                    <tr><th>아이디</th><th>상태</th><th>마지막 로그인</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="admin : ${admins}">
                        <td th:text="${admin.username}">admin</td>
                        <td><span class="badge" th:text="${admin.enabled ? '활성' : '비활성'}">활성</span></td>
                        <td th:text="${admin.lastLoginAt ?: '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </article>

            <article class="panel">
                <h2>새 관리자 등록</h2>
                <form method="post" th:action="@{/admins}" th:object="${registrationRequest}" class="form-stack">
                    <label>
                        관리자 아이디
                        <input type="text" th:field="*{username}" autocomplete="off">
                        <small class="field-error" th:errors="*{username}"></small>
                    </label>
                    <label>
                        임시 비밀번호
                        <input type="password" th:field="*{password}" autocomplete="new-password">
                        <small class="field-error" th:errors="*{password}"></small>
                    </label>
                    <button type="submit" class="primary-button">관리자 등록</button>
                </form>
            </article>
        </section>

        <section class="panel account-password-panel">
            <div class="panel-heading">
                <div>
                    <h2>내 비밀번호 변경</h2>
                    <span th:text="|현재 로그인 계정: ${currentAdmin}|">현재 로그인 계정: admin</span>
                </div>
            </div>
            <form method="post" th:action="@{/admins/password}" th:object="${changePasswordRequest}"
                  class="form-stack password-change-form">
                <label>
                    현재 비밀번호
                    <input type="password" th:field="*{currentPassword}" autocomplete="current-password">
                    <small class="field-error" th:errors="*{currentPassword}"></small>
                </label>
                <label>
                    새 비밀번호
                    <input type="password" th:field="*{newPassword}" autocomplete="new-password">
                    <small class="field-error" th:errors="*{newPassword}"></small>
                </label>
                <label>
                    새 비밀번호 확인
                    <input type="password" th:field="*{newPasswordConfirmation}" autocomplete="new-password">
                    <small class="field-error" th:errors="*{newPasswordConfirmation}"></small>
                    <small class="field-error" th:errors="*{newPasswordConfirmed}"></small>
                </label>
                <button type="submit" class="primary-button">비밀번호 변경</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
