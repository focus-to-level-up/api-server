<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Admin 대시보드</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></aside>
    <main class="content">
        <header class="page-header">
            <div>
                <h1>대시보드</h1>
                <p>관리자 서버의 독립 실행과 세션 인증 골격이 준비되었습니다.</p>
            </div>
        </header>
        <section class="status-grid">
            <article class="status-card">
                <span>인증 방식</span>
                <strong>세션 로그인</strong>
                <p>API JWT와 분리된 Admin 전용 인증입니다.</p>
            </article>
            <article class="status-card">
                <span>현재 관리자</span>
                <strong th:text="${currentAdmin}">admin</strong>
                <p>모든 관리자 계정은 동일한 권한을 가집니다.</p>
            </article>
            <article class="status-card">
                <span>다음 화면</span>
                <strong>회원 관리</strong>
                <p>기존 Next.js 화면을 기준으로 순차 전환합니다.</p>
            </article>
        </section>
    </main>
</div>
</body>
</html>
