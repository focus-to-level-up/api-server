bootJar { enabled = true }
jar { enabled = false }

dependencies {
    implementation project(':levelup-domain')
    implementation project(':levelup-common')
    implementation project(':levelup-infra:mysql')
    implementation project(':levelup-infra:redis')
    implementation project(':levelup-infra:client')

    // Web & Security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Monitoring
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.3.0'

    // etc(Temp)
    implementation 'com.google.firebase:firebase-admin:9.7.0'

}
