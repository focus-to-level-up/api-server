name: CI/CD Module Template

on:
  workflow_call:
    inputs:
      environment:
        description: 'dev/prod'
        required: true
        type: string
      module_name:
        description: 'api/admin/batch'
        required: false
        default: 'api'
        type: string
      gradle_task:
        description: 'Gradle bootJar task'
        required: false
        default: ':levelup-application:api:bootJar'
        type: string
      module_dir:
        description: 'Module directory used to copy the bootJar'
        required: false
        default: 'levelup-application/api'
        type: string
      deploy_strategy:
        description: 'bluegreen/simple'
        required: false
        default: 'bluegreen'
        type: string
      compose_service:
        description: 'Docker compose service for simple deployment'
        required: false
        default: 'api'
        type: string
      image_tag:
        description: 'Optional image tag override'
        required: false
        default: ''
        type: string

env:
  IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || (inputs.environment == 'prod' && github.ref_type == 'tag' && github.ref_name || github.sha) }}
  EC2_HOST: ${{ inputs.environment == 'prod' && secrets.EC2_HOST_PROD || secrets.EC2_HOST_DEV }}
  EC2_SSH_KEY: ${{ inputs.environment == 'prod' && secrets.EC2_SSH_KEY_PROD || secrets.EC2_SSH_KEY_DEV }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_REPO_API: ${{ secrets.DOCKER_REPO_API || 'focus-to-level-up-api' }}
  DOCKER_REPO_ADMIN: ${{ secrets.DOCKER_REPO_ADMIN || 'focus-to-level-up-admin' }}
  DOCKER_REPO_BATCH: ${{ secrets.DOCKER_REPO_BATCH || 'focus-to-level-up-batch' }}

jobs:
  build-and-release:
    name: Build and Release ${{ inputs.module_name }} for ${{ inputs.environment }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          case "${{ inputs.module_name }}" in
            api)
              IMAGE_REPO="${DOCKER_USERNAME}/${DOCKER_REPO_API}"
              ;;
            admin)
              IMAGE_REPO="${DOCKER_USERNAME}/${DOCKER_REPO_ADMIN}"
              ;;
            batch)
              IMAGE_REPO="${DOCKER_USERNAME}/${DOCKER_REPO_BATCH}"
              ;;
            *)
              echo "Unsupported module_name: ${{ inputs.module_name }}"
              exit 1
              ;;
          esac

          {
            echo "tags<<EOF"
            echo "${IMAGE_REPO}:${IMAGE_TAG}"
            if [ "${{ inputs.environment }}" = "prod" ]; then
              echo "${IMAGE_REPO}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha,scope=${{ inputs.module_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.module_name }}
          build-args: |
            GRADLE_TASK=${{ inputs.gradle_task }}
            MODULE_DIR=${{ inputs.module_dir }}
          tags: ${{ steps.image.outputs.tags }}
          platforms: linux/amd64

  deploy:
    needs: build-and-release
    runs-on: ubuntu-24.04
    name: Deploy ${{ inputs.module_name }} for ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure directory permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo mkdir -p /opt/focus-to-level-up
            sudo chown -R $USER:$USER /opt/focus-to-level-up

      - name: Copy docker-compose file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          source: docker-compose-${{ inputs.environment }}.yml
          target: /opt/focus-to-level-up

      - name: Copy deploy scripts to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          source: scripts/deploy.sh,scripts/deploy-api-bluegreen.sh,scripts/deploy-simple.sh
          target: /opt/focus-to-level-up

      - name: Copy DB init scripts to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          source: levelup-application/api/src/main/resources/db/
          target: /opt/focus-to-level-up
          strip_components: 0

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPO_API,DOCKER_REPO_ADMIN,DOCKER_REPO_BATCH
          port: 22
          script: |
            set -euo pipefail

            cd /opt/focus-to-level-up

            API_IMAGE_TAG_CURRENT=$(grep '^API_IMAGE_TAG=' .env 2>/dev/null | cut -d '=' -f2- || true)
            ADMIN_IMAGE_TAG_CURRENT=$(grep '^ADMIN_IMAGE_TAG=' .env 2>/dev/null | cut -d '=' -f2- || true)
            BATCH_IMAGE_TAG_CURRENT=$(grep '^BATCH_IMAGE_TAG=' .env 2>/dev/null | cut -d '=' -f2- || true)

            API_IMAGE_TAG_VALUE="${API_IMAGE_TAG_CURRENT:-latest}"
            ADMIN_IMAGE_TAG_VALUE="${ADMIN_IMAGE_TAG_CURRENT:-latest}"
            BATCH_IMAGE_TAG_VALUE="${BATCH_IMAGE_TAG_CURRENT:-latest}"

            case "${{ inputs.module_name }}" in
              api)
                API_IMAGE_TAG_VALUE="${IMAGE_TAG}"
                ;;
              admin)
                ADMIN_IMAGE_TAG_VALUE="${IMAGE_TAG}"
                ;;
              batch)
                BATCH_IMAGE_TAG_VALUE="${IMAGE_TAG}"
                ;;
              *)
                echo "Unsupported module_name: ${{ inputs.module_name }}"
                exit 1
                ;;
            esac

            cat > .env << 'ENV_EOF'
            ${{ inputs.environment == 'prod' && secrets.ENV_FILE_PROD || secrets.ENV_FILE_DEV }}
            ENV_EOF

            cat >> .env << ENV_EOF

            DOCKER_USERNAME=${DOCKER_USERNAME}
            DOCKER_REPO_API=${DOCKER_REPO_API}
            DOCKER_REPO_ADMIN=${DOCKER_REPO_ADMIN}
            DOCKER_REPO_BATCH=${DOCKER_REPO_BATCH}
            API_IMAGE_TAG=${API_IMAGE_TAG_VALUE}
            ADMIN_IMAGE_TAG=${ADMIN_IMAGE_TAG_VALUE}
            BATCH_IMAGE_TAG=${BATCH_IMAGE_TAG_VALUE}
            ENV_EOF

            mv docker-compose-${{ inputs.environment }}.yml docker-compose.yml
            chmod +x scripts/deploy.sh scripts/deploy-api-bluegreen.sh scripts/deploy-simple.sh

            echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

            if [ "${{ inputs.environment }}" != "prod" ]; then
              docker compose -f docker-compose.yml up -d mysql redis
              sleep 15

              DB_ROOT_PASSWORD=$(grep '^DB_ROOT_PASSWORD=' .env | cut -d '=' -f2-)
              DB_USERNAME=$(grep '^DB_USERNAME=' .env | cut -d '=' -f2-)

              docker exec focus-mysql mysql -uroot -p${DB_ROOT_PASSWORD} -e "CREATE DATABASE IF NOT EXISTS focus_meta_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" || true
              docker exec focus-mysql mysql -uroot -p${DB_ROOT_PASSWORD} -e "GRANT ALL PRIVILEGES ON focus_meta_db.* TO '${DB_USERNAME}'@'%';" || true
              docker exec focus-mysql mysql -uroot -p${DB_ROOT_PASSWORD} -e "FLUSH PRIVILEGES;" || true
            fi

            if [ "${{ inputs.deploy_strategy }}" = "bluegreen" ]; then
              ./scripts/deploy-api-bluegreen.sh
            else
              case "${{ inputs.compose_service }}" in
                admin)
                  ./scripts/deploy-simple.sh admin http://127.0.0.1:9090/admin/actuator/health
                  ;;
                batch)
                  ./scripts/deploy-simple.sh batch "" "Started FocusToLevelupBatchApplication"
                  ;;
                *)
                  echo "Unsupported simple deploy service: ${{ inputs.compose_service }}"
                  exit 1
                  ;;
              esac
            fi

            docker image prune -f
