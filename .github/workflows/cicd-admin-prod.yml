name: CI/CD Admin for Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional image tag override'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  call-cicd-template:
    name: Deploy Admin for Production
    uses: ./.github/workflows/cicd-template.yml
    secrets: inherit
    with:
      environment: 'prod'
      module_name: 'admin'
      gradle_task: ':levelup-application:admin:bootJar'
      module_dir: 'levelup-application/admin'
      deploy_strategy: 'simple'
      compose_service: 'admin'
      image_tag: ${{ inputs.image_tag }}
