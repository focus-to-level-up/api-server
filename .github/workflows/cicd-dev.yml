name: CI/CD for Development (Docker Compose)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  call-cicd-template:
    name: Deploy API for Development
    uses: ./.github/workflows/cicd-template.yml
    secrets: inherit
    with:
      environment: 'dev'
      module_name: 'api'
      gradle_task: ':levelup-application:api:bootJar'
      module_dir: 'levelup-application/api'
      deploy_strategy: 'bluegreen'
