services:
  api-blue:
    image: ${DOCKER_USERNAME}/${DOCKER_REPO_API}:${API_IMAGE_TAG}
    container_name: focus-to-levelup-api-blue
    restart: always
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - redis
    networks:
      - focus-network

  api-green:
    image: ${DOCKER_USERNAME}/${DOCKER_REPO_API}:${API_IMAGE_TAG}
    container_name: focus-to-levelup-api-green
    restart: always
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - redis
    networks:
      - focus-network

  admin:
    image: ${DOCKER_USERNAME}/${DOCKER_REPO_ADMIN}:${ADMIN_IMAGE_TAG}
    container_name: focus-to-levelup-admin
    restart: always
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - ADMIN_SERVER_PORT=9090
      - SERVER_SERVLET_CONTEXT_PATH=/admin
    networks:
      - focus-network

  batch:
    image: ${DOCKER_USERNAME}/${DOCKER_REPO_BATCH}:${BATCH_IMAGE_TAG}
    container_name: focus-to-levelup-batch
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - redis
    networks:
      - focus-network

  redis:
    image: redis:latest
    platform: linux/amd64
    container_name: focus-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - focus-network

volumes:
  redis-data:

networks:
  focus-network:
    driver: bridge
